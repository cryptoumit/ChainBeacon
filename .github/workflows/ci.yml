name: CI

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24.22.3
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls

      - name: Audit full dependency tree
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production extension
        run: npm run build