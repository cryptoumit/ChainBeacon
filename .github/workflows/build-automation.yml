name: Package browser extensions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release and manifest versions
        run: npm run release:check-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - name: Package separate extension distributions
        run: |
          cd dist/chrome && zip -qr ../../chainbeacon-chrome.zip .
          cd ../firefox && zip -qr ../../chainbeacon-firefox.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: chainbeacon-browser-extensions
          path: chainbeacon-*.zip
          if-no-files-found: error
          retention-days: 30

  attach-release-assets:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chainbeacon-browser-extensions
          path: release-assets
      - name: Attach extension ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test -f release-assets/chainbeacon-chrome.zip
          test -f release-assets/chainbeacon-firefox.zip
          gh release upload "$RELEASE_TAG" \
            release-assets/chainbeacon-chrome.zip \
            release-assets/chainbeacon-firefox.zip \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
