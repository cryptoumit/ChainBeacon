name: Build automation

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'cryptoumit'
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.package.outputs.archive_name }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm 11.19.1
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls

      - name: Audit full dependency tree
        run: npm audit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production extension
        run: npm run build

      - name: Package and verify extension
        id: package
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/package-extension.mjs

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chainbeacon-extension
          path: |
            ${{ steps.package.outputs.archive_name }}
            ${{ steps.package.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  attach-release-assets:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: chainbeacon-extension
          path: release-assets

      - name: Attach ZIP and checksum to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
        run: |
          set -euo pipefail
          test -f "release-assets/$ARCHIVE_NAME"
          test -f "release-assets/$ARCHIVE_NAME.sha256"
          gh release upload "$RELEASE_TAG" \
            "release-assets/$ARCHIVE_NAME" \
            "release-assets/$ARCHIVE_NAME.sha256" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
