name: Package browser extensions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm run build:chrome
      - run: npm run build:firefox
      - name: Package separate extension distributions
        run: |
          cd dist/chrome && zip -qr ../../chainbeacon-chrome.zip .
          cd ../firefox && zip -qr ../../chainbeacon-firefox.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: chainbeacon-browser-extensions
          path: chainbeacon-*.zip
          if-no-files-found: error
          retention-days: 30
